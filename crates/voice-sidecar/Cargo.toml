[package]
name = "jettbot-voice-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
bytes = "1"
dashmap = "6"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "cache"] }
songbird = { version = "0.6", features = ["serenity", "gateway", "driver", "receive", "builtin-queue", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

